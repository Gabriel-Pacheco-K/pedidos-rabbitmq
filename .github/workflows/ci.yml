name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testes de integração usam PostgreSQL e RabbitMQ reais (Testcontainers)
      - name: Build e testes
        run: mvn -B verify

      - name: Build das imagens Docker
        run: |
          for service in order-service inventory-service payment-service; do
            docker build --build-arg SERVICE=$service -t pedidos/$service .
          done
