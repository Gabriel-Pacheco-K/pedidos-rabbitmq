# Topologia, usuários e permissões vêm do definitions.json: os serviços não declaram nada.
load_definitions = /etc/rabbitmq/definitions.json

# Mensagens maiores que 128 KB são recusadas pelo broker.
max_message_size = 131072

# O usuário padrão "guest" só funciona a partir do próprio contêiner.
loopback_users.guest = true
